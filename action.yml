name: storelingo
description: AI localization of Google Play and App Store listings (fastlane metadata)
branding:
  icon: globe
  color: blue

inputs:
  command:
    description: "translate, check or translate-and-check"
    default: translate-and-check
  working-directory:
    description: Directory with storelingo.config.json
    default: "."
  args:
    description: Extra arguments for translate (for example "--locale ru")
    default: ""
  commit:
    description: 'Commit and push changed files ("true" or "false")'
    default: "false"
  commit-message:
    description: Commit message used when commit is "true"
    default: "chore: update store listing translations (storelingo)"
  anthropic-api-key:
    description: Anthropic API key (pass a secret)
    default: ""
  openai-api-key:
    description: OpenAI API key (pass a secret)
    default: ""
  translator-api-key:
    description: API key for another OpenAI-compatible host (pass a secret)
    default: ""
  translator-api-host:
    description: Host allowed to receive translator requests
    default: ""
  node-version:
    description: Node.js version
    default: "22"

outputs:
  changed:
    description: '"true" when the commit step committed changed files, otherwise "false"'
    value: ${{ steps.commit.outputs.changed || 'false' }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Validate command
      shell: bash
      env:
        STORELINGO_COMMAND: ${{ inputs.command }}
        STORELINGO_COMMIT: ${{ inputs.commit }}
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        case "$STORELINGO_COMMAND" in
          translate|check|translate-and-check) ;;
          *)
            echo "::error::Unknown command '$STORELINGO_COMMAND'. Use translate, check or translate-and-check."
            exit 1
            ;;
        esac
        # Refuse before any credits are spent or secrets are loaded.
        if [ "$STORELINGO_COMMIT" = "true" ]; then
          case "$EVENT_NAME" in
            push|workflow_dispatch|schedule) ;;
            *)
              echo "::error::commit: true is allowed only on push, workflow_dispatch or schedule events on a branch. For pull requests use command: check."
              exit 1
              ;;
          esac
          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::commit: true is allowed only on push, workflow_dispatch or schedule events on a branch. For pull requests use command: check."
            exit 1
          fi
        fi

    - name: Build storelingo
      id: build
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund && npm run build

    - name: Translate
      id: translate
      if: inputs.command == 'translate' || inputs.command == 'translate-and-check'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        STORELINGO_TRANSLATOR_API_KEY: ${{ inputs.translator-api-key }}
        STORELINGO_TRANSLATOR_API_HOST: ${{ inputs.translator-api-host }}
        STORELINGO_ARGS: ${{ inputs.args }}
      run: |
        for v in ANTHROPIC_API_KEY OPENAI_API_KEY STORELINGO_TRANSLATOR_API_KEY; do
          if [ -n "${!v}" ]; then echo "::add-mask::${!v}"; fi
        done
        # Word-splitting of the args is intended; globbing is disabled.
        set -f
        node "$GITHUB_ACTION_PATH/dist/bin.js" translate $STORELINGO_ARGS

    - name: Check
      id: check
      if: inputs.command == 'check' || inputs.command == 'translate-and-check'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/dist/bin.js" check

    - name: Commit
      id: commit
      if: ${{ !cancelled() }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STORELINGO_COMMAND: ${{ inputs.command }}
        STORELINGO_COMMIT: ${{ inputs.commit }}
        STORELINGO_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        BUILD_OUTCOME: ${{ steps.build.outcome }}
        TRANSLATE_OUTCOME: ${{ steps.translate.outcome }}
        CHECK_OUTCOME: ${{ steps.check.outcome }}
        # Treat every path below literally (no glob magic in config paths).
        GIT_LITERAL_PATHSPECS: "1"
      run: |
        if [ "$STORELINGO_COMMIT" != "true" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Commit only when every step the command runs has succeeded.
        ok=1
        [ "$BUILD_OUTCOME" = "success" ] || ok=0
        case "$STORELINGO_COMMAND" in
          translate|translate-and-check) [ "$TRANSLATE_OUTCOME" = "success" ] || ok=0 ;;
        esac
        case "$STORELINGO_COMMAND" in
          check|translate-and-check) [ "$CHECK_OUTCOME" = "success" ] || ok=0 ;;
        esac
        if [ "$ok" -ne 1 ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "Skipping commit because an earlier step did not succeed."
          exit 0
        fi
        # Only storelingo output: the configured metadata folders and the lock file.
        # A failure of node fails this step (no silent fallback).
        PATHS_TEXT=$(node -e '
          const fs = require("node:fs");
          const raw = fs.readFileSync("storelingo.config.json", "utf8").replace(/^\uFEFF/, "");
          const c = JSON.parse(raw);
          const s = c.stores ?? {};
          const p = c.paths ?? {};
          const out = [];
          if (s.play) out.push(p.play ?? "fastlane/metadata/android");
          if (s.appstore) out.push(p.appstore ?? "fastlane/metadata");
          out.push("storelingo.lock.json");
          console.log(out.join("\n"));
        ')
        mapfile -t CANDIDATES <<< "$PATHS_TEXT"
        PATHS=()
        for p in "${CANDIDATES[@]}"; do
          if [ -n "$p" ] && [ -e "$p" ]; then PATHS+=("$p"); fi
        done
        if [ "${#PATHS[@]}" -eq 0 ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$(git status --porcelain -- "${PATHS[@]}")" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git add -A -- "${PATHS[@]}"
        # Commit only these paths, even if an earlier workflow step staged other files.
        git -c user.name="github-actions[bot]" \
            -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -m "$STORELINGO_COMMIT_MESSAGE" -- "${PATHS[@]}"
        git push origin "HEAD:$BRANCH"
        echo "changed=true" >> "$GITHUB_OUTPUT"
