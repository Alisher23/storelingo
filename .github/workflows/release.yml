name: Release to npm
# Publishes the package when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored in this repository.
# One-time setup is described in docs/releasing.md.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No registry-url here: it writes an _authToken entry to .npmrc, and
          # npm then tries token auth instead of OIDC (actions/setup-node#1551).
          # npm uses registry.npmjs.org by default.
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - name: Check that the tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION."
            exit 1
          fi
          if npm view "storelingo@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::storelingo@$VERSION is already on npm, nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: npm ci
      - if: steps.version.outputs.published == 'false'
        run: npm run lint && npm run typecheck && npm test
      - if: steps.version.outputs.published == 'false'
        run: npm publish
